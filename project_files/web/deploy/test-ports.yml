# Test override: the stack on ports 8080/8443/46731 (see project_files/web/ci/deploy-smoke.sh)
services:
  site:
    ports: !override
      - "8080:80"
      - "8443:443"
  server:
    command: !override
      - --port=46631
      - --ws-port=46632
      - --ws-origin=https://localhost:8443
      - --trusted-proxy=172.30.0.10
      # browsers on the test host reach the server through the network gateway;
      # do not limit their reconnects (several tabs, reloads)
      - --reconnect-limit-exempt=172.30.0.1
    ports: !override
      - "46731:46631"
networks:
  hw:
    ipam:
      config: !override
        - subnet: 172.30.0.0/24
