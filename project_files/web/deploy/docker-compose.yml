# Hedgewars online: web client (Caddy) and game server.
#
#   cp .env.example .env    # set DOMAIN, optionally basic auth / desktop clients
#   docker compose pull && docker compose up -d     # images from GHCR
#
# To build the images yourself instead, add build.yml (needs the repository).
#
# Web clients connect through Caddy (HTTPS, /ws). Desktop clients need the
# game server's port, published by desktop-clients.yml (see .env.example).
# Run from this directory.

name: hedgewars

services:
  site:
    image: ${HW_IMAGES:-ghcr.io/thechosenone1984}/hedgewars-site:${HW_VERSION:-latest}
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      # optional basic auth for the whole site (empty password: off)
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-hedgewars}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      hw:
        ipv4_address: 172.30.0.10
    depends_on:
      - server
    restart: unless-stopped

  server:
    image: ${HW_IMAGES:-ghcr.io/thechosenone1984}/hedgewars-server:${HW_VERSION:-latest}
    command:
      - --port=46631
      - --ws-port=46632
      - --ws-origin=https://${DOMAIN:-localhost}
      - --ws-origin=http://${DOMAIN:-localhost}
      - --trusted-proxy=172.30.0.10
      # the health check connects from inside the container every 30 s
      - --reconnect-limit-exempt=127.0.0.1
    environment:
      RUST_LOG: info
      # on: limit reconnects per address (2 in 30 s, 3 in 2 min, 5 in 10 min)
      HW_RECONNECT_LIMIT: ${RECONNECT_LIMIT:-on}
    volumes:
      - server_data:/var/lib/hedgewars-server
    networks:
      hw:
        ipv4_address: 172.30.0.20
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/46631"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

networks:
  hw:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  caddy_data:
  caddy_config:
  server_data:
