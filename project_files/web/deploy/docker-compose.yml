# Hedgewars online: web client (Caddy) and game server.
#
#   cp .env.example .env    # set DOMAIN, optionally basic auth / desktop clients
#   docker compose up -d
#
# Web clients connect through Caddy (HTTPS, /ws). Desktop clients need the
# game server's port, published by desktop-clients.yml (see .env.example).
# Run from this directory.

name: hedgewars

services:
  site:
    build:
      context: ../../..
      dockerfile: project_files/web/docker/Dockerfile
      target: site
      args:
        # where the footer's "Source code" link points (GPL)
        SOURCE_URL: ${SOURCE_URL:-https://github.com/TheChosenOne1984/HedgewarsWeb}
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      # optional basic auth for the whole site (empty password: off)
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-hedgewars}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      hw:
        ipv4_address: 172.30.0.10
    depends_on:
      - server
    restart: unless-stopped

  server:
    build:
      context: ../../..
      dockerfile: project_files/web/docker/Dockerfile
      target: server
    command:
      - --port=46631
      - --ws-port=46632
      - --ws-origin=https://${DOMAIN:-localhost}
      - --ws-origin=http://${DOMAIN:-localhost}
      - --trusted-proxy=172.30.0.10
      # the health check connects from inside the container every 30 s
      - --reconnect-limit-exempt=127.0.0.1
    environment:
      RUST_LOG: info
    volumes:
      - server_data:/var/lib/hedgewars-server
    networks:
      hw:
        ipv4_address: 172.30.0.20
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/46631"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

networks:
  hw:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  caddy_data:
  caddy_config:
  server_data:
