# Hedgewars online: web client (Caddy) and game server.
#
#   DOMAIN=hw.example.org docker compose up -d
#
# Desktop clients connect to the game server directly on port 46631, web
# clients through Caddy (HTTPS, /ws). Run from this directory.

name: hedgewars

services:
  site:
    build:
      context: ../../..
      dockerfile: project_files/web/docker/Dockerfile
      target: site
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      hw:
        ipv4_address: 172.30.0.10
    depends_on:
      - server
    restart: unless-stopped

  server:
    build:
      context: ../../..
      dockerfile: project_files/web/docker/Dockerfile
      target: server
    command:
      - --port=46631
      - --ws-port=46632
      - --ws-origin=https://${DOMAIN:-localhost}
      - --ws-origin=http://${DOMAIN:-localhost}
      - --trusted-proxy=172.30.0.10
    environment:
      RUST_LOG: info
    ports:
      - "46631:46631"
    volumes:
      - server_data:/var/lib/hedgewars-server
    networks:
      hw:
        ipv4_address: 172.30.0.20
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/46631"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

networks:
  hw:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  caddy_data:
  caddy_config:
  server_data:
