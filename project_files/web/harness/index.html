<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hedgewars Engine Harness</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 14px system-ui, sans-serif; }
  #bar { display: flex; gap: 12px; align-items: center; padding: 8px 12px; background: #1c1c1c; }
  #bar button { font: inherit; padding: 4px 14px; }
  #status { opacity: 0.8; }
  #stage { position: absolute; top: 44px; left: 0; right: 0; bottom: 0; }
  #canvas { display: block; width: 100%; height: 100%; outline: none; background: #000; }
  #log { position: absolute; right: 0; bottom: 0; width: 40%; max-height: 40%; overflow: auto;
         margin: 0; padding: 6px; background: rgba(0,0,0,0.6); font: 11px monospace; display: none; }
  body.showlog #log { display: block; }
</style>
</head>
<body>
<div id="bar">
  <button id="start">Start hotseat game</button>
  <label><input id="ai" type="checkbox"> vs AI</label>
  <label><input id="showlog" type="checkbox"> log</label>
  <span id="status">idle</span>
</div>
<div id="stage">
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
  <pre id="log"></pre>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
