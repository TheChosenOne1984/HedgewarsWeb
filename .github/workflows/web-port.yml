name: Web port

on:
  push:
    branches: [web-port, 'web-port/**']
  pull_request:
    paths:
      - 'hedgewars/**'
      - 'tools/pas2c/**'
      - 'project_files/hwc/**'
      - 'project_files/web/**'
      - 'rust/**'
      - 'web/**'
      - '.github/workflows/web-port.yml'

# a newer push to the same branch replaces a run still in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-gate:
    name: engine determinism gate (FPC, pas2c, web)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build toolchain image
        run: docker build --target web -t hw-web-web project_files/web/docker

      - name: Engine gate (FPC vs pas2c vs web engine)
        run: project_files/web/docker/run.sh web project_files/web/ci/engine-gate.sh

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: engine-gate-logs
          path: |
            build-gate/*.log
            build-gate/corpus/

  server-tests:
    name: server (all features)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build toolchain image
        run: docker build --target native -t hw-web-native project_files/web/docker

      - name: Server and protocol tests
        run: project_files/web/docker/run.sh native project_files/web/ci/server-tests.sh

  web-tests:
    name: web frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build toolchain image
        run: docker build --target web -t hw-web-web project_files/web/docker

      - name: Lint, types, tests
        run: project_files/web/docker/run.sh web project_files/web/ci/web-tests.sh
